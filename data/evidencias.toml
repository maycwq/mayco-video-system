# registro de evidências. cada afirmação técnica ou criativa importante do repositório aponta para um id daqui.
# classes:
#   fato-observado        visto diretamente numa fonte (camada, keyframe, frame de vídeo, metadado)
#   resultado-verificado  confirmado por medição ou teste sobre um render ou arquivo
#   instrucao-explicita   pedido do usuário, implementado ou não
#   implementacao-relatada declarado em conversa ou relato, sem verificação independente
#   interpretacao         inferência sustentada por evidências citadas em "relacionadas"
#   hipotese              ideia que ainda precisa de investigação
#   decisao-nova          proposta feita durante a reconstrução
# confianca: alta | media | baixa. confiança não substitui fonte.
# identificadores entre crases são nomes de camada, node ids ou valores copiados das fontes.

